name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pr_activity
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pr_activity
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pr_activity" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://pr_activity:ci_only@localhost:5432/pr_activity
      - run: npm audit --omit=dev --audit-level=high
